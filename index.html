<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夜空の花火</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
  /* Layout: full-bleed night sky canvas, vertical title upper-left, firework-type picker docked at the bottom like a festival program */
  :root {
    --night: #060814;
    --ink: #eef0ff;
    --dim: #9aa0c4;
    --gold: #ffcf6b;
    --panel: rgba(10, 12, 30, 0.62);
    --line: rgba(255, 220, 160, 0.22);
    --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--night);
    color: var(--ink);
    font-family: var(--f-body);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas#sky {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none; cursor: crosshair;
  }
  .title {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 20px);
    left: 18px;
    writing-mode: vertical-rl;
    pointer-events: none;
  }
  .title h1 {
    margin: 0;
    font-family: var(--f-display); font-weight: 800;
    font-size: clamp(28px, 7vw, 46px);
    letter-spacing: 0.18em;
    color: var(--ink);
    text-shadow: 0 0 18px rgba(255, 200, 120, 0.35);
  }
  .title p {
    margin: 0; margin-block-start: 8px; padding-top: 6px;
    font-size: 12px; letter-spacing: 0.3em; color: var(--dim);
  }
  .sound {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    right: 16px;
    font: 700 13px var(--f-body); letter-spacing: 0.1em;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 14px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    cursor: pointer;
  }
  .sound[aria-pressed="false"] { color: var(--dim); }
  .hint {
    position: fixed; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 150px);
    text-align: center; font-size: 13px; letter-spacing: 0.25em; color: var(--dim);
    pointer-events: none;
    transition: opacity 1.2s;
  }
  .hint.gone { opacity: 0; }
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
    background: linear-gradient(to top, rgba(4, 6, 16, 0.92), rgba(4, 6, 16, 0));
  }
  .types {
    max-width: 720px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px;
  }
  .types button {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 10px 4px 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--ink);
    cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: border-color .2s, box-shadow .2s, transform .1s;
  }
  .types button:active { transform: scale(0.96); }
  .types button b {
    font-family: var(--f-display); font-weight: 800; font-size: 20px; line-height: 1.2;
  }
  .types button small { font-size: 10px; letter-spacing: 0.08em; color: var(--dim); }
  .types button[aria-pressed="true"] {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold), 0 0 18px rgba(255, 207, 107, 0.35);
  }
  .types button[aria-pressed="true"] small { color: var(--gold); }
  .types button.mine b { color: var(--gold); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (max-width: 520px) {
    .types { grid-template-columns: repeat(3, 1fr); }
    .hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 200px); }
  }
</style>
</head>
<body>

<canvas id="sky" aria-label="花火を打ち上げる夜空。タップした場所に花火が上がります"></canvas>

<div class="title">
  <h1>夜空の花火</h1>
  <p>好きな場所をタップ</p>
</div>

<button class="sound" id="sound" aria-pressed="true">音 あり</button>

<div class="hint" id="hint">夜空をタップすると、そこに花火が上がります</div>

<nav class="dock" aria-label="花火の種類">
  <div class="types" id="types">
    <button data-type="kiku" aria-pressed="true"><b>菊</b><small>きく</small></button>
    <button data-type="botan" aria-pressed="false"><b>牡丹</b><small>ぼたん</small></button>
    <button data-type="yanagi" aria-pressed="false"><b>柳</b><small>やなぎ</small></button>
    <button data-type="senrin" aria-pressed="false"><b>千輪</b><small>せんりん</small></button>
    <button data-type="heart" aria-pressed="false"><b>ハート</b><small>型物</small></button>
    <button data-type="mine" class="mine" aria-pressed="false"><b>連発</b><small>スターマイン</small></button>
  </div>
</nav>

<script>
(() => {
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const sky = document.createElement('canvas');      // particles with fading trails
  const sctx = sky.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, DPR = 1, S = 1, waterY = 0;
  let stars = [], hills = [];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const c of [canvas, sky]) { c.width = W * DPR; c.height = H * DPR; }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.max(0.6, Math.min(W, H) / 700);
    const dock = document.querySelector('.dock');
    const dockH = dock ? dock.offsetHeight : 0;
    waterY = Math.min(H * 0.8, H - dockH - Math.max(60, H * 0.08));
    stars = Array.from({ length: Math.round(W * H / 4500) }, () => ({
      x: Math.random() * W, y: Math.random() * waterY * 0.9,
      r: Math.random() * 1.1 + 0.2, p: Math.random() * Math.PI * 2
    }));
    // distant hills on the far bank
    hills = [];
    let h = waterY - 18;
    for (let x = 0; x <= W + 20; x += 20) {
      h += (Math.random() - 0.5) * 10;
      h = Math.max(waterY - 42, Math.min(waterY - 8, h));
      hills.push([x, h]);
    }
  }
  addEventListener('resize', resize);
  resize();

  // ---------- sound ----------
  let audio = null, soundOn = true, noiseBuf = null;
  function initAudio() {
    if (audio) return;
    try {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = audio.createBuffer(1, audio.sampleRate * 2, audio.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { audio = null; }
  }
  function boom(size = 1, delay = 0) {
    if (!audio || !soundOn) return;
    const t = audio.currentTime + delay;
    const src = audio.createBufferSource(); src.buffer = noiseBuf;
    const lp = audio.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(120, t + 1.2);
    const g = audio.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.55 * size, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    src.connect(lp).connect(g).connect(audio.destination);
    src.start(t); src.stop(t + 1.7);
    // low thump
    const o = audio.createOscillator(); const og = audio.createGain();
    o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(35, t + 0.5);
    og.gain.setValueAtTime(0.5 * size, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    o.connect(og).connect(audio.destination); o.start(t); o.stop(t + 0.65);
  }
  function whistle(dur) {
    if (!audio || !soundOn) return;
    const t = audio.currentTime;
    const o = audio.createOscillator(); const g = audio.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(500, t); o.frequency.exponentialRampToValueAtTime(1600, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.025, t + 0.1);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function crackle(count = 30, delay = 0) {
    if (!audio || !soundOn) return;
    const base = audio.currentTime + delay;
    for (let i = 0; i < count; i++) {
      const t = base + Math.random() * 0.9;
      const src = audio.createBufferSource(); src.buffer = noiseBuf;
      const hp = audio.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2500;
      const g = audio.createGain();
      g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
      src.connect(hp).connect(g).connect(audio.destination);
      src.start(t, Math.random()); src.stop(t + 0.04);
    }
  }

  // ---------- fireworks ----------
  const PALETTES = [
    ['#ff4d6d', '#ffd6e0'], ['#ffd166', '#fff3c4'], ['#5ad1ff', '#d6f3ff'],
    ['#7ae582', '#e0ffe4'], ['#c792ff', '#f0e2ff'], ['#ff8a3d', '#ffe0c7'],
    ['#ffffff', '#ffd166']
  ];
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const rockets = [], parts = [];
  const G = 0.045;

  function launch(tx, ty, type) {
    const sx = tx + (Math.random() - 0.5) * 40;
    const sy = waterY;
    ty = Math.max(H * 0.1, Math.min(waterY - 80, ty));
    const g = G * S * 1.2;
    const vy = -Math.sqrt(2 * g * (sy - ty));
    const frames = -vy / g;
    rockets.push({ x: sx, y: sy, vx: (tx - sx) / frames, vy, g, type });
    whistle(Math.min(2.2, frames / 60));
  }

  function sphere(n, speed, fn) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const z = Math.random() * 2 - 1;
      const r = Math.sqrt(1 - z * z);
      const sp = speed * (0.94 + Math.random() * 0.06);
      fn(Math.cos(a) * r * sp, Math.sin(a) * r * sp);
    }
  }
  function add(p) {
    if (parts.length > 4000) return;
    p.px = p.x; p.py = p.y;
    p.age = 0;
    parts.push(p);
  }

  function explode(x, y, type) {
    const [c1, c2] = pick(PALETTES);
    const k = S;
    if (type === 'kiku') {
      sphere(130, 3.6 * k, (vx, vy) => add({ x, y, vx, vy, life: 95, c: c1, c2, w: 1.8, drag: 0.975, grav: 0.035 * k }));
      const [p1] = pick(PALETTES);
      sphere(45, 1.6 * k, (vx, vy) => add({ x, y, vx, vy, life: 70, c: p1, w: 1.6, drag: 0.97, grav: 0.03 * k }));
      boom(1);
    } else if (type === 'botan') {
      sphere(110, 3.3 * k, (vx, vy) => add({ x, y, vx, vy, life: 70, c: c1, c2, w: 3, drag: 0.965, grav: 0.03 * k, dot: true, flick: true }));
      boom(0.9);
    } else if (type === 'yanagi') {
      sphere(85, 2.6 * k, (vx, vy) => add({ x, y, vx, vy, life: 190, c: '#ffcf6b', c2: '#ff9a3d', w: 1.4, drag: 0.982, grav: 0.028 * k, trailFade: true }));
      boom(0.8); crackle(14, 1.2);
    } else if (type === 'senrin') {
      sphere(12, 2.2 * k, (vx, vy) => add({ x, y, vx, vy, life: 42, c: '#ffe6a8', w: 1.4, drag: 0.97, grav: 0.02 * k, burst: true }));
      boom(0.7); crackle(40, 0.7);
    } else if (type === 'heart') {
      const n = 90, sc = 0.2 * k;
      for (let i = 0; i < n; i++) {
        const t = (i / n) * Math.PI * 2;
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        add({ x, y, vx: hx * sc, vy: -hy * sc, life: 90, c: '#ff5c8a', c2: '#ffd6e0', w: 2.4, drag: 0.955, grav: 0.012 * k, dot: true });
      }
      boom(0.9);
    }
  }

  let mineTimers = [];
  function starMine() {
    mineTimers.forEach(clearTimeout); mineTimers = [];
    const kinds = ['kiku', 'botan', 'kiku', 'senrin', 'yanagi', 'botan', 'heart'];
    for (let i = 0; i < 22; i++) {
      mineTimers.push(setTimeout(() => {
        launch(W * (0.12 + Math.random() * 0.76), H * (0.15 + Math.random() * 0.3), pick(kinds));
      }, i * 190 + Math.random() * 120));
    }
    // finale
    mineTimers.push(setTimeout(() => {
      [0.25, 0.5, 0.75].forEach((f, i) => setTimeout(() => launch(W * f, H * 0.18, 'kiku'), i * 80));
    }, 22 * 190 + 600));
  }

  // ---------- input ----------
  let current = 'kiku';
  let lastTouch = 0;
  const hint = document.getElementById('hint');
  canvas.addEventListener('pointerdown', e => {
    initAudio(); audio && audio.resume && audio.resume();
    lastTouch = performance.now();
    hint.classList.add('gone');
    if (current === 'mine') starMine();
    else launch(e.clientX, e.clientY, current);
  });
  document.getElementById('types').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    initAudio(); audio && audio.resume && audio.resume();
    lastTouch = performance.now();
    if (b.dataset.type === 'mine') { hint.classList.add('gone'); starMine(); return; }
    current = b.dataset.type;
    for (const x of document.querySelectorAll('#types button')) x.setAttribute('aria-pressed', String(x === b));
    launch(W * (0.3 + Math.random() * 0.4), H * (0.2 + Math.random() * 0.15), current);
  });
  const soundBtn = document.getElementById('sound');
  soundBtn.addEventListener('click', () => {
    initAudio();
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.textContent = soundOn ? '音 あり' : '音 なし';
  });

  // idle show so the sky is never empty
  setInterval(() => {
    if (document.hidden) return;
    if (performance.now() - lastTouch > 5000 && rockets.length < 2) {
      launch(W * (0.15 + Math.random() * 0.7), H * (0.15 + Math.random() * 0.3),
             pick(['kiku', 'botan', 'yanagi', 'senrin', 'kiku', 'heart']));
    }
  }, 1500);
  setTimeout(() => launch(W * 0.38, H * 0.25, 'kiku'), 300);
  setTimeout(() => launch(W * 0.66, H * 0.3, 'yanagi'), 1100);

  // ---------- loop ----------
  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const r = (pa >> 16) + (((pb >> 16) - (pa >> 16)) * t) | 0;
    const g = ((pa >> 8) & 255) + ((((pb >> 8) & 255) - ((pa >> 8) & 255)) * t) | 0;
    const bl = (pa & 255) + (((pb & 255) - (pa & 255)) * t) | 0;
    return `rgb(${r},${g},${bl})`;
  }

  let last = performance.now(), time = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 16.67, 3); last = now; time += dt;

    // fade the trail layer
    sctx.globalCompositeOperation = 'destination-out';
    sctx.fillStyle = `rgba(0,0,0,${reduceMotion ? 0.5 : 0.16 * dt})`;
    sctx.fillRect(0, 0, W, H);
    sctx.globalCompositeOperation = 'lighter';
    sctx.lineCap = 'round';

    // rockets
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      const px = r.x, py = r.y;
      r.x += r.vx * dt; r.y += r.vy * dt; r.vy += r.g * dt;
      sctx.strokeStyle = '#ffe2a8'; sctx.lineWidth = 2;
      sctx.beginPath(); sctx.moveTo(px, py); sctx.lineTo(r.x, r.y); sctx.stroke();
      if (Math.random() < 0.7) add({ x: r.x, y: r.y, vx: (Math.random() - 0.5) * 0.6, vy: Math.random() * 0.8, life: 22, c: '#ffb36b', w: 1, drag: 0.95, grav: 0.02 });
      if (r.vy >= -0.4) { rockets.splice(i, 1); explode(r.x, r.y, r.type); }
    }

    // particles
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.px = p.x; p.py = p.y;
      const d = Math.pow(p.drag, dt);
      p.vx *= d; p.vy *= d; p.vy += p.grav * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.age += dt;
      const t = p.age / p.life;
      if (t >= 1) {
        parts.splice(i, 1);
        if (p.burst) {
          const [c1] = pick(PALETTES);
          sphere(26, 1.3 * S, (vx, vy) => add({ x: p.x, y: p.y, vx, vy, life: 40, c: c1, w: 2, drag: 0.95, grav: 0.025 * S, dot: true, flick: true }));
        }
        continue;
      }
      let alpha = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
      if (p.flick && t > 0.55 && Math.random() < 0.45) alpha *= 0.15;
      const col = p.c2 ? mix(p.c, p.c2, Math.min(1, t * 1.3)) : p.c;
      sctx.globalAlpha = alpha;
      if (p.dot) {
        sctx.fillStyle = col;
        sctx.beginPath(); sctx.arc(p.x, p.y, p.w * (1 - t * 0.5), 0, Math.PI * 2); sctx.fill();
      } else {
        sctx.strokeStyle = col; sctx.lineWidth = p.w * (1 - t * 0.4);
        sctx.beginPath(); sctx.moveTo(p.px, p.py); sctx.lineTo(p.x, p.y); sctx.stroke();
      }
      if (p.trailFade && Math.random() < 0.25) {
        add({ x: p.x, y: p.y, vx: 0, vy: 0.2, life: 30, c: '#b8742a', w: 0.9, drag: 0.9, grav: 0.01 });
      }
    }
    sctx.globalAlpha = 1;

    // compose: sky gradient, stars, hills, fireworks, river reflection
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#04050f'); bg.addColorStop(0.75, '#0e1230'); bg.addColorStop(0.8, '#141a3a'); bg.addColorStop(1, '#03040b');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(time * 0.03 + s.p);
      ctx.fillStyle = '#dfe4ff';
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;

    ctx.drawImage(sky, 0, 0, W, H);

    ctx.fillStyle = '#05060f';
    ctx.beginPath(); ctx.moveTo(0, waterY);
    for (const [x, y] of hills) ctx.lineTo(x, y);
    ctx.lineTo(W, waterY); ctx.closePath(); ctx.fill();

    // reflection, drawn in rippling strips
    const waterH = H - waterY;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const strip = 3;
    for (let y = 0; y < waterH; y += strip) {
      const srcY = waterY - y * (waterY / waterH) * 0.9 - strip;
      const off = Math.sin(time * 0.05 + y * 0.18) * (2 + y * 0.06);
      ctx.globalAlpha = 0.42 * (1 - y / waterH);
      ctx.drawImage(sky, 0, srcY * DPR, W * DPR, strip * DPR, off, waterY + y, W, strip);
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(255,220,170,0.08)';
    ctx.fillRect(0, waterY, W, 1);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
